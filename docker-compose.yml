version: '3.8'

services:
  db:
    image: postgis/postgis:14-3.3
    container_name: postgis_container
    networks:
      default:
        aliases:
          - postgis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bikes_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Database connection (connects to the db service)
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=true
    volumes:
      - ./backend:/app/backend
      - ./data:/app/Data
      - ./cache:/app/cache
      - ./logs:/app/logs
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  martin:
    image: ghcr.io/maplibre/martin:main
    container_name: bikes_martin
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URL_ENCODED}@db:5432/${POSTGRES_DB}
    command: --listen-addresses=0.0.0.0:3000
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: bikes_frontend
  #   ports:
  #     - "5173:5173"
