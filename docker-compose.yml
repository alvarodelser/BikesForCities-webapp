version: '3.8'

services:
  b4c_database:
    image: postgis/postgis:14-3.3
    container_name: postgis_container
    networks:
      default:
        aliases:
          - postgis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

  b4c_backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bikes_backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - b4c_database
    environment:
      # Database connection (connects to the db service)
      - POSTGRES_HOST=b4c_database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=true
    volumes:
      - ./backend:/app/backend
      - ./data:/app/Data
      - ./cache:/app/cache
      - ./logs:/app/logs
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  b4c_tile_server:
    image: ghcr.io/maplibre/martin:main
    container_name: bikes_martin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - b4c_database
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@b4c_database:5432/${POSTGRES_DB}
    command: --listen-addresses=0.0.0.0:3000
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: bikes_frontend
  #   ports:
  #     - "5173:5173"
