# nlp_service/docker-compose.yml
# Standalone for local dev. Production deploys merge this into the root compose.
services:
  nlp-service:
    build: .
    container_name: nlp-service
    ports:
      - "8001:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      DEDUP_LSH_THRESHOLD: "0.9"
      DEDUP_EMBED_THRESHOLD: "0.85"
      DEDUP_PERSIST_EVERY_N: "10"
      DEDUP_DATA_DIR: /data/dedup
      NLP_LOG_LEVEL: INFO
    volumes:
      - nlp_dedup_data:/data/dedup
    depends_on:
      - ollama
    networks:
      - b4c-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - b4c-net

volumes:
  nlp_dedup_data:
  ollama_models:

networks:
  b4c-net:
    driver: bridge
